name = "smoke-scape-events"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Create the KV namespace first:
#   npx wrangler kv namespace create EVENTS_KV
# Then paste the id it prints into this binding:
[[kv_namespaces]]
binding = "EVENTS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Set the write token as a secret, not here:
#   npx wrangler secret put EVENTS_WRITE_TOKEN
